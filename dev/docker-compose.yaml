name: fiapx-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiapx}
      POSTGRES_USER: ${POSTGRES_USER:-fiapx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapx}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    # 5433 no host de propósito: esta máquina tem um PostgreSQL 16 local como serviço
    # automático na 5432. Sem isso há disputa pela porta, e o pior caso não é falhar ao
    # subir — é a aplicação conectar no banco errado em silêncio.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiapx} -d ${POSTGRES_DB:-fiapx}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiapx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiapx}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 96M

  # Object storage compatível com S3 para desenvolvimento e teste.
  # Duas trocas forçadas por eventos externos, ambas medidas em 2026-11-26:
  #   MinIO     -> fechou o acesso anônimo às imagens no Docker Hub E no quay.io
  #   LocalStack -> :latest virou edição licenciada, sai com código 55 sem auth token
  # Os buckets nascem da variável initialBuckets: não há passo de inicialização.
  s3:
    image: adobe/s3mock:latest
    # Os nomes são estes, e o container aceita qualquer outro em silêncio: `root` e
    # `ROOT` chegaram ao container e foram ignorados, com o log caindo em
    # `configured as "<default temp-dir>"` (medido em 2026-11-28).
    # O volume tem de ser montado em /s3mockroot: o caminho é pré-criado na imagem e
    # pertence ao usuário não-root `cnb`, então um volume em outro lugar nasce do root e
    # o processo não consegue escrever.
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fiapx-videos,fiapx-zips
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "9090:9090"
    volumes:
      - s3_data:/s3mockroot
    deploy:
      resources:
        limits:
          memory: 384M

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  rabbitmq_data:
  s3_data:
